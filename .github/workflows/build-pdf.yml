name: Обновить PDF из index.html

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'   # запускается только если менялась сама страница —
                        # коммит с новым PDF не вызовет повторный запуск
  workflow_dispatch: {} # позволяет запустить вручную из вкладки Actions

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Установить puppeteer
        run: npm install puppeteer@22

      - name: Сгенерировать PDF из index.html
        run: node scripts/render-pdf.js

      - name: Закоммитить обновлённый PDF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Автообновление PDF из index.html [skip ci]"
          file_pattern: "20-promptov-dlya-kontenta.pdf"
